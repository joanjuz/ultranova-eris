name: Separar las islas de Alola
on:
  push:
    branches: [main]
    paths:
      - 'assets/alola-islands-detailed.png'
      - 'scripts/prepare_alola_islands.py'
      - '.github/workflows/prepare-alola-islands.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar Pillow
        run: python -m pip install Pillow
      - name: Generar cuatro PNG transparentes
        run: python scripts/prepare_alola_islands.py
      - name: Incorporar las cuatro imágenes al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/islas/*.png
          if ! git diff --cached --quiet; then
            git commit -m "[assets] cuatro islas de Alola sin fondo [skip ci]"
            git push origin HEAD:main
          fi
